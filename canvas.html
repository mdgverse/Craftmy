<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Infinido</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    width: 100%; height: 100%;
    background: #0a0a0a;
    /* Fundo de pontos estilo Figma */
    background-image:
      radial-gradient(#1a1a1a 1px, transparent 1px);
    background-size: 20px 20px;
    cursor: grab;
  }
  #viewport:active {
    cursor: grabbing;
  }
</style>
</head>
<body>

<div id="viewport"></div>

<script>
const viewport = document.getElementById('viewport');
let isPanning = false;
let startX, startY, scrollLeft, scrollTop;
let zoom = 1;

// Zoom com roda do mouse (centralizado no cursor)
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mouseX = (e.clientX - rect.left + viewport.scrollLeft) / zoom;
  const mouseY = (e.clientY - rect.top + viewport.scrollTop) / zoom;

  const delta = -e.deltaY * 0.001;
  const newZoom = Math.min(Math.max(0.1, zoom + delta), 5);

  // Ajustar scroll para manter o ponto sob o cursor fixo
  viewport.scrollLeft = (e.clientX - rect.left + viewport.scrollLeft) - mouseX * newZoom;
  viewport.scrollTop = (e.clientY - rect.top + viewport.scrollTop) - mouseY * newZoom;

  zoom = newZoom;
}, { passive: false });

// Pan com arrasto
viewport.addEventListener('mousedown', (e) => {
  isPanning = true;
  startX = e.clientX;
  startY = e.clientY;
  scrollLeft = viewport.scrollLeft;
  scrollTop = viewport.scrollTop;
  viewport.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  viewport.scrollLeft = scrollLeft - dx;
  viewport.scrollTop = scrollTop - dy;
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  viewport.style.cursor = 'grab';
});
</script>

</body>
</html>
